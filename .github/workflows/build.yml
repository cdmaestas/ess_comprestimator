name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Go vet
        run: go vet ./...

      - name: Install Python tools
        # Dev tooling is pinned (see the file's header for why); runtime deps
        # stay loose here so pip-audit still sees what a fresh install gets.
        run: |
          pip install --quiet -r backend/requirements-dev.lock
          pip install --quiet -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check backend/ tests/

      - name: Ruff format check
        run: ruff format --check backend/ tests/

      - name: Backend tests
        run: python -m pytest tests/ -q

      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit -r backend/requirements.txt

      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck -q
          find . -name "*.sh" -not -path "./.git/*" -not -path "*/node_modules/*" \
            | xargs shellcheck

  # Runs the Go suite on both platform families. macos-latest runners are
  # arm64 — this is the job that would have caught the compression library
  # returning "incompressible" for every sample on non-amd64 builds (see
  # cmd/root_test.go: TestMinlzTryEncodeCompressibleText). ubuntu-latest is
  # still needed alongside it since it's amd64 and exercises the assembly
  # encoder path that arm64 doesn't have.
  go-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l cmd/ main.go)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet + tests
        run: |
          go vet ./...
          go test ./... -v

  build:
    needs: [lint-and-security, go-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dist-mac
          - os: ubuntu-latest
            artifact: dist-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y rpm

      # ── macOS code signing ───────────────────────────────────────────────────
      # Requires these repository secrets (Settings → Secrets and variables →
      # Actions):
      #   APPLE_CERTIFICATE       — base64-encoded Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD — password chosen when exporting the .p12
      #   APPLE_TEAM_ID           — 10-character Apple Team ID
      #   APPLE_ID                — Apple ID email used for notarization
      #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password for that Apple ID
      # Leave secrets unset to produce unsigned builds (e.g. forks, PRs).
      #
      # No manual `security create-keychain` step is needed: given CSC_LINK
      # (base64 .p12) and CSC_KEY_PASSWORD, electron-builder creates its own
      # temporary keychain, imports the certificate, and tears it down after.
      - name: Build
        env:
          # electron-builder reads CSC_* for signing. An empty-but-defined
          # CSC_LINK makes it treat "" as a cert path and fail, so the run
          # step below only exports the CSC_*/APPLE_* vars when the secrets
          # are actually set (forks and PRs produce unsigned builds).
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$_APPLE_CERTIFICATE" ]; then
            export CSC_LINK="$_APPLE_CERTIFICATE"
            export CSC_KEY_PASSWORD="$_APPLE_CERTIFICATE_PASSWORD"
          else
            # No cert: disable signing lookup entirely on macOS runners.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$_APPLE_ID" ]; then
            # electron-builder notarization (notarytool)
            export APPLE_ID="$_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$_APPLE_TEAM_ID"
          fi
          ./build.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      # secrets.* isn't readable directly in step-level `if:` conditions —
      # mirror it into a job-level env var, which is.
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Install signing tools
        run: sudo apt-get install -y rpm

      # GPG_PRIVATE_KEY is optional: if it isn't set (e.g. a fork, or before
      # the secret has been added to this repo), the release still publishes
      # with unsigned RPMs rather than failing the whole run.
      - name: Import GPG signing key
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG 2>/dev/null \
            | grep "^sec" | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          printf '%%_gpg_name %s\n%%__gpg /usr/bin/gpg\n%%__gpg_sign_cmd %%{__gpg} gpg --batch --no-verbose --no-armor --no-secmem-warning -u "%%{_gpg_name}" -sbo %%{__signature_filename} --digest-algo sha256 %%{__plaintext_filename}\n' "$KEY_ID" > ~/.rpmmacros

      - name: Sign RPM packages
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        run: |
          for rpm in dist-all/*.rpm; do
            rpmsign --addsign "$rpm"
            echo "Signed: $rpm"
          done

      - name: Verify RPM signatures
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        run: |
          rpm --import packaging/RPM-GPG-KEY-comprestimator
          for rpm in dist-all/*.rpm; do
            rpm --checksig "$rpm" && echo "OK: $rpm"
          done

      - name: Warn if shipping unsigned RPMs
        if: ${{ env.HAS_GPG_KEY == 'false' }}
        run: |
          echo "::warning::GPG_PRIVATE_KEY is not set — RPM packages in this release are unsigned."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_GPG_KEY" = "true" ]; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              dist-all/* \
              packaging/RPM-GPG-KEY-comprestimator
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              dist-all/*
          fi
