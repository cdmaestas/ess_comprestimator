<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- IBM Blue background -->
  <circle cx="256" cy="256" r="240" fill="#0f62fe"/>
  
  <!-- Large file/folder on left (before compression) -->
  <g transform="translate(120, 200)">
    <!-- Folder shape -->
    <path d="M 0,20 L 0,80 L 80,80 L 80,20 L 40,20 L 30,10 L 0,10 Z" 
          fill="#ffffff" opacity="0.9"/>
    <!-- Size indicator -->
    <text x="40" y="105" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">100GB</text>
  </g>
  
  <!-- Compression arrows (pointing inward) -->
  <g transform="translate(256, 256)">
    <!-- Left arrow -->
    <path d="M -80,-10 L -40,-10 L -40,-20 L -20,0 L -40,20 L -40,10 L -80,10 Z" 
          fill="#42be65" opacity="0.9"/>
    <!-- Right arrow -->
    <path d="M 80,-10 L 40,-10 L 40,-20 L 20,0 L 40,20 L 40,10 L 80,10 Z" 
          fill="#42be65" opacity="0.9"/>
    
    <!-- Center compression symbol -->
    <circle cx="0" cy="0" r="35" fill="#161616" stroke="#42be65" stroke-width="3"/>
    <text x="0" y="12" text-anchor="middle" fill="#42be65" font-size="32" font-weight="bold">⇄</text>
  </g>
  
  <!-- Small file/folder on right (after compression) -->
  <g transform="translate(352, 220)">
    <!-- Smaller folder shape -->
    <path d="M 0,15 L 0,60 L 60,60 L 60,15 L 30,15 L 22,7 L 0,7 Z" 
          fill="#ffffff" opacity="0.9"/>
    <!-- Size indicator -->
    <text x="30" y="80" text-anchor="middle" fill="#42be65" font-size="16" font-weight="bold">25GB</text>
  </g>
  
  <!-- Compression ratio badge at bottom -->
  <g transform="translate(256, 420)">
    <rect x="-50" y="-20" width="100" height="40" rx="20" fill="#161616" opacity="0.8"/>
    <text x="0" y="8" text-anchor="middle" fill="#42be65" font-size="24" font-weight="bold">4:1</text>
  </g>
  
  <!-- IBM stripes (subtle) -->
  <g opacity="0.08">
    <rect x="40" y="40" width="432" height="6" fill="#ffffff"/>
    <rect x="40" y="60" width="432" height="6" fill="#ffffff"/>
    <rect x="40" y="80" width="432" height="6" fill="#ffffff"/>
  </g>
</svg>