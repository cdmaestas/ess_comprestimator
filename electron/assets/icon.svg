<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- IBM Blue gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0043ce;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Compression clamp squeezing ESS text -->
  <g transform="translate(256, 256)">
    <!-- Left clamp jaw -->
    <rect x="-150" y="-80" width="25" height="160" rx="5" fill="#ffffff" opacity="0.95"/>
    <rect x="-150" y="-100" width="80" height="20" rx="5" fill="#ffffff" opacity="0.95"/>
    
    <!-- Right clamp jaw (closer to show compression) -->
    <rect x="125" y="-80" width="25" height="160" rx="5" fill="#ffffff" opacity="0.95"/>
    <rect x="70" y="-100" width="80" height="20" rx="5" fill="#ffffff" opacity="0.95"/>
    
    <!-- Screw mechanism -->
    <line x1="105" y1="-90" x2="105" y2="90" stroke="#42be65" stroke-width="6"/>
    <circle cx="105" cy="-90" r="12" fill="#42be65"/>
    <circle cx="105" cy="90" r="12" fill="#42be65"/>
    
    <!-- ESS text - slightly condensed to show compression effect -->
    <text x="0" y="25" text-anchor="middle" fill="#ffffff" font-size="110" font-weight="bold" font-family="IBM Plex Sans, Arial, sans-serif" letter-spacing="-8">ESS</text>
    
    <!-- Compression lines (showing squeeze effect) -->
    <line x1="-120" y1="-60" x2="-90" y2="-60" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    <line x1="-120" y1="0" x2="-90" y2="0" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    <line x1="-120" y1="60" x2="-90" y2="60" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    
    <line x1="90" y1="-60" x2="120" y2="-60" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    <line x1="90" y1="0" x2="120" y2="0" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    <line x1="90" y1="60" x2="120" y2="60" stroke="#42be65" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
