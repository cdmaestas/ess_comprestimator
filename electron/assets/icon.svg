<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- IBM Blue gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0043ce;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Compression clamp squeezing ESS text -->
  <g transform="translate(256, 256)">
    <!-- Left clamp jaw -->
    <rect x="-180" y="-100" width="25" height="200" rx="5" fill="#ffffff" opacity="0.95"/>
    <rect x="-180" y="-120" width="90" height="20" rx="5" fill="#ffffff" opacity="0.95"/>
    
    <!-- Right clamp jaw -->
    <rect x="155" y="-100" width="25" height="200" rx="5" fill="#ffffff" opacity="0.95"/>
    <rect x="90" y="-120" width="90" height="20" rx="5" fill="#ffffff" opacity="0.95"/>
    
    <!-- Screw mechanism -->
    <line x1="125" y1="-110" x2="125" y2="110" stroke="#42be65" stroke-width="6"/>
    <circle cx="125" cy="-110" r="12" fill="#42be65"/>
    <circle cx="125" cy="110" r="12" fill="#42be65"/>
    
    <!-- ESS text - fills circle top to bottom, horizontally compressed, WHITE for visibility -->
    <g transform="scale(0.5, 2.0)">
      <text x="0" y="50" text-anchor="middle" fill="#ffffff" font-size="220" font-weight="900" font-family="IBM Plex Sans, Arial, sans-serif" letter-spacing="-8">ESS</text>
    </g>
    
    <!-- Compression lines -->
    <line x1="-150" y1="-70" x2="-110" y2="-70" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    <line x1="-150" y1="0" x2="-110" y2="0" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    <line x1="-150" y1="70" x2="-110" y2="70" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    
    <line x1="110" y1="-70" x2="150" y2="-70" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    <line x1="110" y1="0" x2="150" y2="0" stroke="#42be65" stroke-width="3" opacity="0.6"/>
    <line x1="110" y1="70" x2="150" y2="70" stroke="#42be65" stroke-width="3" opacity="0.6"/>
  </g>
</svg>
