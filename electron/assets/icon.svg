<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- IBM Blue background circle -->
  <circle cx="256" cy="256" r="240" fill="#0f62fe"/>
  
  <!-- Compression gauge/meter -->
  <g transform="translate(256, 256)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.3"/>
    
    <!-- Progress arc (representing compression) -->
    <path d="M 0,-160 A 160,160 0 0,1 138.56,-92.38" 
          fill="none" stroke="#42be65" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="100" fill="#161616"/>
    
    <!-- Compression ratio text -->
    <text x="0" y="-10" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="bold" font-family="IBM Plex Sans, sans-serif">4x</text>
    <text x="0" y="30" text-anchor="middle" fill="#78a9ff" font-size="24" font-family="IBM Plex Sans, sans-serif">RATIO</text>
    
    <!-- Storage icon elements -->
    <g transform="translate(0, 80)">
      <!-- Stacked disks representing storage -->
      <ellipse cx="0" cy="-5" rx="60" ry="15" fill="#78a9ff"/>
      <rect x="-60" y="-5" width="120" height="10" fill="#4589ff"/>
      <ellipse cx="0" cy="5" rx="60" ry="15" fill="#0f62fe"/>
    </g>
  </g>
  
  <!-- IBM stripes (subtle) -->
  <g opacity="0.1">
    <rect x="40" y="40" width="432" height="8" fill="#ffffff"/>
    <rect x="40" y="64" width="432" height="8" fill="#ffffff"/>
    <rect x="40" y="88" width="432" height="8" fill="#ffffff"/>
  </g>
</svg>
