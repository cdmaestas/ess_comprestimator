<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- IBM Blue gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0043ce;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Simple compression icon: two arrows pointing to center -->
  <g transform="translate(256, 200)">
    <!-- Left arrow -->
    <path d="M -100,0 L -40,0 L -40,-15 L -10,0 L -40,15 L -40,0 Z" 
          fill="#42be65" stroke="#ffffff" stroke-width="2"/>
    <!-- Right arrow -->
    <path d="M 100,0 L 40,0 L 40,-15 L 10,0 L 40,15 L 40,0 Z" 
          fill="#42be65" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
  </g>
  
  <!-- IBM branding -->
  <text x="256" y="300" text-anchor="middle" fill="#ffffff" font-size="42" font-weight="bold" font-family="IBM Plex Sans, Arial, sans-serif">IBM</text>
  
  <!-- Fusion Compress text -->
  <text x="256" y="340" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="300" font-family="IBM Plex Sans, Arial, sans-serif">Fusion</text>
  <text x="256" y="375" text-anchor="middle" fill="#42be65" font-size="32" font-weight="600" font-family="IBM Plex Sans, Arial, sans-serif">Compress</text>
  
  <!-- Ratio indicator -->
  <g transform="translate(256, 430)">
    <rect x="-40" y="-18" width="80" height="36" rx="18" fill="#161616" opacity="0.7"/>
    <text x="0" y="8" text-anchor="middle" fill="#42be65" font-size="22" font-weight="bold">4:1</text>
  </g>
</svg>
