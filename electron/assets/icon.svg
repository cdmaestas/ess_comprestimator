<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- IBM Blue gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0043ce;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Compression tool visual: C-clamp/vise surrounding ESS -->
  <g transform="translate(256, 256)">
    <!-- Left side of clamp -->
    <rect x="-140" y="-100" width="30" height="200" rx="5" fill="#ffffff" opacity="0.9"/>
    <rect x="-140" y="-120" width="100" height="20" rx="5" fill="#ffffff" opacity="0.9"/>
    
    <!-- Right side of clamp (screw mechanism) -->
    <rect x="110" y="-100" width="30" height="200" rx="5" fill="#ffffff" opacity="0.9"/>
    <rect x="40" y="-120" width="100" height="20" rx="5" fill="#ffffff" opacity="0.9"/>
    
    <!-- Screw threads (compression indicator) -->
    <g opacity="0.7">
      <line x1="75" y1="-80" x2="75" y2="80" stroke="#42be65" stroke-width="8"/>
      <circle cx="75" cy="-60" r="4" fill="#42be65"/>
      <circle cx="75" cy="-30" r="4" fill="#42be65"/>
      <circle cx="75" cy="0" r="4" fill="#42be65"/>
      <circle cx="75" cy="30" r="4" fill="#42be65"/>
      <circle cx="75" cy="60" r="4" fill="#42be65"/>
    </g>
    
    <!-- ESS text in center -->
    <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="120" font-weight="bold" font-family="IBM Plex Sans, Arial, sans-serif">ESS</text>
  </g>
  
  <!-- Compression label at bottom -->
  <g transform="translate(256, 430)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#161616" opacity="0.7"/>
    <text x="0" y="8" text-anchor="middle" fill="#42be65" font-size="20" font-weight="600">COMPRESS</text>
  </g>
</svg>